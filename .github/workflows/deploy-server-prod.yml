name: Deploy Server (Production)

on:
  push:
    branches:
      - main
    paths:
      - 'dish_server/**'
      - '.github/workflows/deploy-server-prod.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure recipe subscription never expires
        run: |
          if gcloud pubsub subscriptions describe dish-jobs-sub --project=personal-ai-264306; then
            gcloud pubsub subscriptions update dish-jobs-sub --expiration-period=never --project=personal-ai-264306
          else
            gcloud pubsub subscriptions create dish-jobs-sub --topic=dish-jobs --expiration-period=never --ack-deadline=600 --project=personal-ai-264306
          fi

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: dish-server
          source: dish_server/
          region: europe-west1
          flags: '--min-instances=1 --no-cpu-throttling --allow-unauthenticated --memory=4Gi --cpu=4000m'
          env_vars: |
            GCLOUD_PROJECT_ID=personal-ai-264306
            IS_PRODUCTION=true

      - name: Show deployment URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
