name: Deploy Server (QA)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'dish_server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: dish-server-qa
          source: dish_server/
          region: europe-west1
          flags: '--min-instances=0 --allow-unauthenticated --memory=4Gi --cpu=4000m'
          env_vars: |
            GCLOUD_PROJECT_ID=personal-ai-264306
            IS_PRODUCTION=false
          secrets: |
            SECRET_KEY=SECRET_KEY:latest

      - name: Comment PR with URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Server deployed to Cloud Run (QA): ${{ steps.deploy.outputs.url }}`
            })
