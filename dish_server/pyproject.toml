[project]
name = "dish-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.12.4",
    "bcrypt==4.0.1",
    "beautifulsoup4>=4.13.4",
    "fastapi[standard]>=0.115.12",
    "google-cloud-documentai>=3.5.0",
    "google-cloud-firestore>=2.20.2",
    "google-cloud-pubsub>=2.34.0",
    "google-cloud-storage>=3.1.0",
    "google-genai>=1.17.0",
    "itsdangerous>=2.2.0",
    "langdetect>=1.0.9",
    "passlib[bcrypt]>=1.7.4",
    "pillow>=11.2.1",
    "pillow-heif>=0.22.0",
    "pydantic-settings>=2.9.1",
    "pyjwt>=2.10.1",
]

[dependency-groups]
# Dev-only tooling, kept OUT of the production image (the Dockerfile uses
# `uv sync --no-dev`). ipykernel in particular drags in a heavy transitive
# tree (debugpy, jedi, pyzmq, IPython, tornado, prompt_toolkit, ...) — ~35MB
# and a few thousand extra files that were being read cold on every Cloud Run
# cold start, inflating import time for no runtime benefit.
dev = [
    "ipykernel>=6.29.5",
    "ruff>=0.11.11",
]
